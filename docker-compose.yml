services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blockhost-frontend
    env_file:
      - ./.env.local
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blockhost-backend
    env_file:
      - ./.env.local
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - ./backend:/app
      - /app/node_modules
